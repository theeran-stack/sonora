services:
  - type: web
    name: sonora
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: sh -c "python manage.py migrate && gunicorn myproject.wsgi:application"
    # Note: Render Free tier does not support persistent disks.
    # To attach a persistent disk in the future, upgrade plan to 'starter' and uncomment:
    # disk:
    #   name: sonora-media
    #   mountPath: /var/data
    #   sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Optional: set when using a persistent disk mount on starter plan:
      # - key: SONORA_PERSISTENT_DIR
      #   value: /var/data
      # Set your sync token, MongoDB URI, and Jamendo Client ID in Render Dashboard:
      # - key: SONORA_SYNC_TOKEN
      #   generateValue: true
      # - key: MONGODB_URI
      #   value: mongodb+srv://<user>:<password>@cluster.mongodb.net/?retryWrites=true&w=majority
      # - key: MONGODB_DB_NAME
      #   value: sonora
      # - key: JAMENDO_CLIENT_ID
      #   value: your_jamendo_client_id
